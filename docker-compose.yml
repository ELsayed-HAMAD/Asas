services:
  db:
    image: postgres:17-alpine
    container_name: asas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: asas-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/asas
    command: ["pnpm", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: asas-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/asas
      BETTER_AUTH_URL: http://localhost:4000
      REDIS_URL: redis://redis:6379
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_ORIGIN: http://localhost:80,http://localhost:5173,http://localhost
    ports:
      - "4000:4000"
    volumes:
      - api_storage:/app/apps/api/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    container_name: asas-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  api_storage:
