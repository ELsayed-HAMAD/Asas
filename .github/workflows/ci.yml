name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asas_test
      REDIS_URL: redis://localhost:6379
      DO_NOT_TRACK: "1"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify peer dependency resolution
        run: pnpm peers check

      - name: Generate Prisma client
        run: pnpm --filter @asas/api run prisma:generate

      - name: Deploy Prisma migrations and triggers to live PostgreSQL 17
        run: pnpm --filter @asas/api run prisma:deploy

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Includes packages/contracts' enums.generated.test.ts, which fails the build the moment
      # a Prisma enum changes without the generated Zod schema being regenerated to match.
      - name: Test
        run: pnpm run test

      - name: Install Playwright browser
        run: pnpm --filter @asas/web exec playwright install --with-deps chromium

      - name: Browser concurrency tests
        run: pnpm run test:e2e

      - name: Production dependency security audit
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm run build
