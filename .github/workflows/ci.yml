name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No live database is required: buildApp() never connects (see apps/api/src/app.ts),
      # and `prisma generate` only reads the schema shape, not the datasource URL.
      - name: Generate Prisma client
        run: pnpm --filter @asas/api run prisma:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Includes packages/contracts' enums.generated.test.ts, which fails the build the moment
      # a Prisma enum changes without the generated Zod schema being regenerated to match.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

