# Reviewed Dependabot configuration for a public repository.
#
# Goals: keep the weekly PR count reviewable and keep routine patch/minor bumps
# in one grouped PR. Major upgrades arrive as individual PRs so each one gets a
# planned migration window (React, Prisma, Vite, and pg-boss all need one).
#
# There are deliberately no `ignore` rules. Dependabot applies them to security
# updates too, so ignoring `version-update:semver-major` would silently suppress
# a major-version security fix. Noise is bounded by open-pull-requests-limit.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
    groups:
      routine:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
